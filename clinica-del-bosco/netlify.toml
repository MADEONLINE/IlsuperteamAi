# Netlify — Clinica Veterinaria del Bosco
# Base directory da impostare nel pannello Netlify: clinica-del-bosco
# (il repository ospita anche la landing page "Super Team" nella radice).

[build]
  base = "clinica-del-bosco"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# In produzione il controllo dati blocca il deploy se restano segnaposto {{DA_CONFERMARE}}.
[context.production.environment]
  CHECK_DATA_STRICT = "1"

# ---------- Redirect 301: domini alternativi → canonico (vedi redirects.map) ----------
[[redirects]]
  from = "https://www.clinicaveterinariadelbosco.it/*"
  to = "https://clinicaveterinariadelbosco.it/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://migliorveterinarionapoli.it/*"
  to = "https://clinicaveterinariadelbosco.it/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.migliorveterinarionapoli.it/*"
  to = "https://clinicaveterinariadelbosco.it/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://clinicadelbosco.com/*"
  to = "https://clinicaveterinariadelbosco.it/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.clinicadelbosco.com/*"
  to = "https://clinicaveterinariadelbosco.it/:splat"
  status = 301
  force = true

