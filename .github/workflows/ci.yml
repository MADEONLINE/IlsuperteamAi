name: CI — Clinica del Bosco

on:
  push:
    paths: ['clinica-del-bosco/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['clinica-del-bosco/**']
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Sonda: URL dell''anteprima pubblicata (codici HTTP e titoli). Vuoto = salta'
        default: ''
        type: string
      urls:
        description: 'Benchmark layout: URL di siti di riferimento separati da spazio. Vuoto = salta'
        default: ''
        type: string

defaults:
  run:
    working-directory: clinica-del-bosco

jobs:
  qualita:
    name: Check, lint, build, budget, test, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinica-del-bosco/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:contrasti
      - run: npm run build
      - name: Dati mancanti (avviso, non bloccante in CI; bloccante nel deploy di produzione)
        run: npm run check:data
      - name: Budget JavaScript per pagina
        run: npm run check:budget
      - name: Browser per i test
        run: npx playwright install --with-deps chromium
      - name: Smoke test percorsi critici (mobile + desktop, axe)
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Lighthouse CI (mobile, budget fallimentare)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            clinica-del-bosco/playwright-report
            clinica-del-bosco/.lighthouseci
          retention-days: 7

  # Deploy di anteprima su Netlify (progetto "anteprima-clinica-del-bosco").
  # Richiede due secret del repository: NETLIFY_AUTH_TOKEN (Netlify → User settings →
  # Personal access tokens) e NETLIFY_SITE_ID (id del progetto). Senza secret il job viene saltato.
  anteprima-netlify:
    name: Deploy anteprima su Netlify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verifica secret
        id: secret
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::Secret NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID assenti: deploy saltato"; fi
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinica-del-bosco/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.secret.outputs.ok == 'true'
      - run: npm run build
        if: steps.secret.outputs.ok == 'true'
        env:
          ANTEPRIMA: '1'
      - name: Deploy su Netlify (anteprima)
        if: steps.secret.outputs.ok == 'true'
        run: npx --yes netlify-cli@latest deploy --dir=dist --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Anteprima ${{ github.sha }}"

  # Sonda l'anteprima pubblicata (GitHub Actions raggiunge Netlify): solo da "Run workflow".
  sonda-anteprima:
    name: Sonda le pagine dell'anteprima pubblicata
    if: github.event_name == 'workflow_dispatch' && inputs.base_url != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      BASE: ${{ inputs.base_url }}
    steps:
      - name: Codici HTTP, redirect e titoli
        run: |
          for p in / /la-struttura /per-i-colleghi /equipe /servizi /servizi/cardiologia /pronto-soccorso /prenota /piani-salute /prima-visita /contatti /magazine /domande-frequenti /per-i-colleghi/grazie /chi-siamo /colleghi /la-struttura/ /sitemap-index.xml /llms.txt; do
            code=$(curl -sS -m 25 -o /tmp/pg -w "%{http_code} %{redirect_url}" "$BASE$p" || echo "ERR")
            title=$(grep -o "<title>[^<]*" /tmp/pg 2>/dev/null | head -1 | sed 's/<title>//')
            printf "%-28s %s   %s\n" "$p" "$code" "$title"
          done
      - name: Header di /la-struttura e /per-i-colleghi
        run: |
          curl -sS -m 25 -I "$BASE/la-struttura" | head -20
          echo ---
          curl -sS -m 25 -I "$BASE/per-i-colleghi" | head -20

  # Analisi di layout di siti di riferimento (rete aperta da GitHub Actions): struttura,
  # navigazione, colori, font e screenshot compressi in base64 nel log.
  benchmark-layout:
    name: Benchmark layout dei siti di riferimento
    if: github.event_name == 'workflow_dispatch' && inputs.urls != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Analisi
        env:
          URLS: ${{ inputs.urls }}
        run: |
          cat > analisi.mjs <<'JS'
          import { chromium } from 'playwright';
          const urls = process.env.URLS.split(/\s+/).filter(Boolean);
          const browser = await chromium.launch();
          for (const url of urls) {
            console.log('\n\n######## ' + url);
            for (const [nome, vp] of [['desktop', { width: 1366, height: 900 }], ['mobile', { width: 390, height: 844 }]]) {
              const ctx = await browser.newContext({ viewport: vp, deviceScaleFactor: 1, locale: 'it-IT', userAgent: nome === 'mobile' ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1' : undefined });
              const page = await ctx.newPage();
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              } catch (e) { console.log('goto:', e.message.slice(0, 120)); }
              // chiudi banner cookie comuni
              for (const t of ['Accetta', 'Accept', 'Accetta tutti', 'OK', 'Ho capito', 'Accept All']) {
                try { await page.getByRole('button', { name: new RegExp('^' + t, 'i') }).first().click({ timeout: 800 }); } catch {}
              }
              await page.waitForTimeout(1200);
              if (nome === 'desktop') {
                const info = await page.evaluate(() => {
                  const txt = (el) => (el?.innerText || '').replace(/\s+/g, ' ').trim();
                  const nav = [...document.querySelectorAll('header a, nav a')].map((a) => txt(a)).filter((t) => t && t.length < 40);
                  const heads = [...document.querySelectorAll('h1,h2,h3')].map((h) => h.tagName + ': ' + txt(h)).filter((t) => t.length > 4).slice(0, 80);
                  const btns = [...document.querySelectorAll('a,button')].filter((b) => /btn|button|cta/i.test(b.className) || b.tagName === 'BUTTON').map((b) => { const cs = getComputedStyle(b); return txt(b).slice(0, 40) + ' | bg ' + cs.backgroundColor + ' | color ' + cs.color + ' | radius ' + cs.borderRadius; }).filter((t) => !t.startsWith(' |')).slice(0, 25);
                  const body = getComputedStyle(document.body);
                  const h1 = document.querySelector('h1'); const h1s = h1 ? getComputedStyle(h1) : null;
                  const header = document.querySelector('header'); const hs = header ? getComputedStyle(header) : null;
                  const colors = {}; for (const el of document.querySelectorAll('*')) { const c = getComputedStyle(el).backgroundColor; if (c && c !== 'rgba(0, 0, 0, 0)') colors[c] = (colors[c] || 0) + 1; }
                  const top = Object.entries(colors).sort((a, b) => b[1] - a[1]).slice(0, 12);
                  const imgs = [...document.images].filter((i) => i.naturalWidth > 200).map((i) => (i.alt || '(no alt)').slice(0, 60) + ' ' + i.naturalWidth + 'x' + i.naturalHeight).slice(0, 40);
                  const sections = [...document.querySelectorAll('main > *, body > section, body > div > section, section')].map((s) => { const r = s.getBoundingClientRect(); return { h: Math.round(s.getBoundingClientRect().height), bg: getComputedStyle(s).backgroundColor, t: txt(s.querySelector('h1,h2,h3')).slice(0, 60) }; }).filter((s) => s.h > 120).slice(0, 40);
                  return { title: document.title, nav: [...new Set(nav)], heads, btns, bodyFont: body.fontFamily, bodySize: body.fontSize, h1Font: h1s?.fontFamily, h1Size: h1s?.fontSize, h1Weight: h1s?.fontWeight, headerBg: hs?.backgroundColor, headerPos: hs?.position, topColors: top, imgs, sections, tel: [...document.querySelectorAll('a[href^="tel:"]')].map((a) => txt(a)).slice(0, 5), pageHeight: document.documentElement.scrollHeight };
                });
                console.log(JSON.stringify(info, null, 1));
              }
              const buf = await page.screenshot({ fullPage: true, type: 'jpeg', quality: 40, scale: 'css' });
              console.log(`SCREENSHOT ${nome} bytes=${buf.length}`);
              console.log('B64START ' + nome);
              const b = buf.toString('base64');
              for (let i = 0; i < b.length; i += 20000) console.log(b.slice(i, i + 20000));
              console.log('B64END ' + nome);
              await ctx.close();
            }
          }
          await browser.close();
          JS
          node analisi.mjs

  indexnow:
    name: IndexNow dopo il deploy di produzione
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: qualita
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Notifica le URL della sitemap (no-op finché manca la chiave)
        run: npm run indexnow
