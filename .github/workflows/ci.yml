name: CI — Clinica del Bosco

on:
  push:
    paths: ['clinica-del-bosco/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['clinica-del-bosco/**']
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Sonda: URL dell''anteprima pubblicata (codici HTTP e titoli). Vuoto = salta'
        default: ''
        type: string
      urls:
        description: 'Benchmark layout: URL di siti di riferimento separati da spazio. Vuoto = salta'
        default: ''
        type: string
      immagini:
        description: 'Importa immagini: coppie nome=URL separate da spazio. Vuoto = salta'
        default: ''
        type: string

defaults:
  run:
    working-directory: clinica-del-bosco

jobs:
  qualita:
    name: Check, lint, build, budget, test, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinica-del-bosco/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:contrasti
      - run: npm run build
      - name: Dati mancanti (avviso, non bloccante in CI; bloccante nel deploy di produzione)
        run: npm run check:data
      - name: Budget JavaScript per pagina
        run: npm run check:budget
      - name: Browser per i test
        run: npx playwright install --with-deps chromium
      - name: Smoke test percorsi critici (mobile + desktop, axe)
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Lighthouse CI (mobile, budget fallimentare)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            clinica-del-bosco/playwright-report
            clinica-del-bosco/.lighthouseci
          retention-days: 7

  # Deploy di anteprima su Netlify (progetto "anteprima-clinica-del-bosco").
  # Richiede due secret del repository: NETLIFY_AUTH_TOKEN (Netlify → User settings →
  # Personal access tokens) e NETLIFY_SITE_ID (id del progetto). Senza secret il job viene saltato.
  anteprima-netlify:
    name: Deploy anteprima su Netlify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verifica secret
        id: secret
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::Secret NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID assenti: deploy saltato"; fi
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinica-del-bosco/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.secret.outputs.ok == 'true'
      - run: npm run build
        if: steps.secret.outputs.ok == 'true'
        env:
          ANTEPRIMA: '1'
      - name: Deploy su Netlify (anteprima)
        if: steps.secret.outputs.ok == 'true'
        run: npx --yes netlify-cli@latest deploy --dir=dist --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Anteprima ${{ github.sha }}"

  # Sonda l'anteprima pubblicata (GitHub Actions raggiunge Netlify): solo da "Run workflow".
  sonda-anteprima:
    name: Sonda le pagine dell'anteprima pubblicata
    if: github.event_name == 'workflow_dispatch' && inputs.base_url != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      BASE: ${{ inputs.base_url }}
    steps:
      - name: Codici HTTP, redirect e titoli
        run: |
          for p in / /la-struttura /per-i-colleghi /equipe /servizi /servizi/cardiologia /pronto-soccorso /prenota /piani-salute /prima-visita /contatti /magazine /domande-frequenti /per-i-colleghi/grazie /chi-siamo /colleghi /la-struttura/ /sitemap-index.xml /llms.txt; do
            code=$(curl -sS -m 25 -o /tmp/pg -w "%{http_code} %{redirect_url}" "$BASE$p" || echo "ERR")
            title=$(grep -o "<title>[^<]*" /tmp/pg 2>/dev/null | head -1 | sed 's/<title>//')
            printf "%-28s %s   %s\n" "$p" "$code" "$title"
          done
      - name: Header di /la-struttura e /per-i-colleghi
        run: |
          curl -sS -m 25 -I "$BASE/la-struttura" | head -20
          echo ---
          curl -sS -m 25 -I "$BASE/per-i-colleghi" | head -20

  # Analisi di layout di siti di riferimento (rete aperta da GitHub Actions): struttura,
  # navigazione, colori, font e screenshot compressi in base64 nel log.
  # Analisi di layout di siti di riferimento (rete aperta da GitHub Actions):
  # struttura delle sezioni, navigazione, titoli, colori, tipografia. Nessuno screenshot nel log.
  benchmark-layout:
    name: Benchmark layout dei siti di riferimento
    if: github.event_name == 'workflow_dispatch' && inputs.urls != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Analisi
        env:
          URLS: ${{ inputs.urls }}
        run: |
          cat > analisi.mjs <<'JS'
          import { chromium } from 'playwright';
          const urls = process.env.URLS.split(/\s+/).filter(Boolean);
          const browser = await chromium.launch();
          for (const url of urls) {
            console.log('\n\n######## ' + url);
            const ctx = await browser.newContext({ viewport: { width: 1366, height: 900 }, locale: 'it-IT' });
            const page = await ctx.newPage();
            try { await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }); }
            catch (e) { console.log('goto:', e.message.slice(0, 120)); }
            for (const t of ['Accetta', 'Accept', 'OK', 'Ho capito', 'Consenti']) {
              try { await page.getByRole('button', { name: new RegExp('^' + t, 'i') }).first().click({ timeout: 700 }); } catch {}
            }
            await page.waitForTimeout(1500);
            let info;
            try {
            info = await page.evaluate(() => {
              const cs = (el) => (el instanceof Element ? getComputedStyle(el) : null);
              const txt = (el) => (el?.innerText || '').replace(/\s+/g, ' ').trim();
              const header = document.querySelector('header') || document.querySelector('[class*=header]');
              const hs = cs(header);
              const nav = [...(header || document).querySelectorAll('a')].map(txt).filter((t) => t && t.length < 40);
              const tel = [...document.querySelectorAll('a[href^="tel:"]')].map((a) => txt(a) || a.getAttribute('href')).slice(0, 6);
              const body = cs(document.body) || {};
              const h1 = document.querySelector('h1'); const h1s = cs(h1);
              const colors = {};
              for (const el of document.querySelectorAll('*')) {
                const s2 = cs(el); if (!s2) continue;
                if (s2.backgroundColor && s2.backgroundColor !== 'rgba(0, 0, 0, 0)') colors[s2.backgroundColor] = (colors[s2.backgroundColor] || 0) + 1;
              }
              const topColors = Object.entries(colors).sort((a, b) => b[1] - a[1]).slice(0, 10);
              const cta = [...document.querySelectorAll('a,button')]
                .filter((b) => /btn|button|cta/i.test(b.className) || b.tagName === 'BUTTON')
                .map((b) => { const s2 = cs(b) || {}; return { t: txt(b).slice(0, 45), bg: s2.backgroundColor, col: s2.color, r: s2.borderRadius, pad: s2.padding }; })
                .filter((b) => b.t).slice(0, 20);
              // sezioni di primo livello: altezza, sfondo, titolo, colonne, immagini
              const root = document.querySelector('main') || document.body;
              const sezioni = [...root.children].flatMap((c) => (c.children.length === 1 && c.tagName === 'DIV' ? [...c.children] : [c]))
                .map((sec) => {
                  const r = sec.getBoundingClientRect(); const s2 = cs(sec) || {};
                  const grid = [...sec.querySelectorAll('*')].find((e) => { const g = cs(e); return g && /grid|flex/.test(g.display) && e.children.length > 2; });
                  return { tag: sec.tagName, h: Math.round(r.height), bg: s2.backgroundColor, titolo: txt(sec.querySelector('h1,h2,h3')).slice(0, 70),
                           colonne: grid ? grid.children.length : 0, img: sec.querySelectorAll('img').length, testo: txt(sec).slice(0, 150) };
                }).filter((x) => x.h > 100);
              const heads = [...document.querySelectorAll('h1,h2')].map((h) => h.tagName + ' ' + txt(h)).filter((t) => t.length > 5).slice(0, 40);
              const imgs = [...document.images].filter((i) => i.naturalWidth > 300).map((i) => (i.alt || '(no alt)').slice(0, 55) + ' [' + i.naturalWidth + 'x' + i.naturalHeight + ']').slice(0, 30);
              return { title: document.title, headerBg: hs?.backgroundColor, headerPos: hs?.position, nav: [...new Set(nav)].slice(0, 30), tel,
                       bodyFont: (body.fontFamily || '').slice(0, 60), bodySize: body.fontSize, h1: txt(h1).slice(0, 120),
                       h1Font: (h1s?.fontFamily || '').slice(0, 60), h1Size: h1s?.fontSize, h1Weight: h1s?.fontWeight, h1Transform: h1s?.textTransform,
                       topColors, cta, sezioni, heads, imgs, altezzaPagina: document.documentElement.scrollHeight };
            });
            } catch (e) { info = { errore: e.message.slice(0, 200) }; }
            console.log(JSON.stringify(info, null, 1));
            await ctx.close();
          }
          await browser.close();
          JS
          node analisi.mjs

  # Importa nel repository immagini generate: scarica gli URL indicati, converte e committa.
  importa-immagini:
    name: Importa immagini generate
    if: github.event_name == 'workflow_dispatch' && inputs.immagini != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinica-del-bosco/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Scarica e converte
        env:
          IMMAGINI: ${{ inputs.immagini }}
        run: |
          mkdir -p src/assets/img /tmp/dl
          for coppia in $IMMAGINI; do
            nome="${coppia%%=*}"; url="${coppia#*=}"
            echo "-> $nome"
            if ! curl -sS -f -L -m 120 -o "/tmp/dl/$nome.png" "$url"; then
              echo "   SALTATO: download fallito"; continue
            fi
            node -e "
              const sharp = require('sharp');
              sharp('/tmp/dl/$nome.png').resize({ width: 2000, withoutEnlargement: true })
                .jpeg({ quality: 82, mozjpeg: true })
                .toFile('src/assets/img/$nome.jpg')
                .then((i) => console.log('   ', '$nome.jpg', i.width + 'x' + i.height, Math.round(i.size / 1024) + ' KB'))
                .catch((e) => { console.log('   SALTATO:', e.message); });
            " || echo "   SALTATO: conversione fallita"
          done
          ls -l src/assets/img
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/img
          git diff --cached --quiet || git commit -m "chore(foto): importa immagini generate per gli slot fotografici"
          git push origin HEAD:${{ github.ref_name }}

  indexnow:
    name: IndexNow dopo il deploy di produzione
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: qualita
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Notifica le URL della sitemap (no-op finché manca la chiave)
        run: npm run indexnow
